# Builds the sites and publishes them to GitHub Pages on every push to main.
#   Site A (the first version):        https://mydigitalcrib.github.io/the-creator-maison/
#   The campaign (the new version):    https://mydigitalcrib.github.io/the-creator-maison/v2/
# Each version keeps its own link: the campaign is built into a v2/ folder next to Site A.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Site A
        run: npm run build -w @mfm/open-file
        env:
          SITE_URL: https://mydigitalcrib.github.io
          SITE_BASE: /the-creator-maison/
      - name: Point links at /the-creator-maison/
        run: node scripts/rebase-dist.mjs apps/open-file/dist /the-creator-maison/
      - name: Build the campaign (v2)
        run: npm run build -w @mfm/campaign
        env:
          SITE_BASE: /the-creator-maison/v2/
      - name: Put the campaign at /v2/
        run: cp -r apps/campaign/dist apps/open-file/dist/v2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/open-file/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
